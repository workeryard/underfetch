# Releases the package when a version tag is pushed.
#
# The only workflow here: day-to-day, `make check` run locally is the gate,
# and the live checks against real servers stay local too. This one checks
# the tagged commit again, stages it on npm through trusted publishing — no
# token exists, npm trusts this workflow by its OIDC identity — and opens the
# GitHub release. The version goes live only once a maintainer approves the
# staged package on npmjs.com, with two-factor authentication.
#
#   git tag -a v0.1.1 -m 0.1.1 && git push origin v0.1.1

name: release

on:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # Named in the package's trusted publisher on npm, which accepts no other.
    environment: npm
    permissions:
      contents: write # the GitHub release
      id-token: write # the OIDC token npm trusts, and the provenance it signs
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # npm stage, and staging through a trusted publisher, came after the
      # npm that Node ships with.
      - run: npm install --global npm@12.2.0

      - name: The tag names the version in package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match package.json ${version}"
            exit 1
          fi

      - run: pnpm install --frozen-lockfile

      - name: Typecheck, lint and test
        run: make check

      - name: Typecheck the packed package as an installing Worker project would
        run: make consumer-check

      - name: Stage on npm, with provenance
        run: npm stage publish . --provenance --access public

      - name: Open the GitHub release, from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '
            $0 ~ "^## " v " " { on = 1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || { echo "no changelog entry for ${version}"; exit 1; }
          {
            printf '```\nnpm install @workeryard/underfetch@%s\n```\n\n' "$version"
            printf '**Experimental.** See [Status](https://github.com/%s#status). ' "$GITHUB_REPOSITORY"
            printf 'Live on npm once its staged release is approved.\n'
            cat notes.md
          } > release.md
          gh release create "$GITHUB_REF_NAME" --title "$version" --notes-file release.md --verify-tag
